name: Build Wii Homebrew

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build DOL
        run: |
          make

      - name: Create App Bundle
        run: |
          mkdir -p WiiStream
          cp boot.dol WiiStream/
          cp meta.xml WiiStream/

      - name: Upload Wii App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiiStream-App
          path: WiiStream/
